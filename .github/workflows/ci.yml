name: CI

on:
  push:
    branches: [main, "claude/**"]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      # Testcontainers usa o Docker do runner (Postgres + PostGIS reais)
      - run: ./gradlew test --no-daemon
      - name: Contrato da API atualizado?
        run: git diff --exit-code openapi.json || (echo "openapi.json mudou: rode ./gradlew test e commite (e npm run api:gen no mobile)" && exit 1)

  mobile:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - run: npm ci
      - run: npm run api:gen && git diff --exit-code src/api/schema.d.ts
      - name: Textos legais iguais aos do backend?
        run: npm run legal:gen && git diff --exit-code src/legal/docs.ts
      - run: npx tsc --noEmit

  terraform:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra/terraform
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      - name: Formatação (mostra o que o terraform fmt mudaria)
        run: terraform fmt -recursive -diff || true
      - run: terraform init -backend=false -input=false
      - run: terraform validate

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: A imagem da API compila
        run: docker build -t beautifulapp-api backend
