spring:
  application:
    name: beautifulapp
  threads:
    virtual:
      enabled: true
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    locations: classpath:db/migration
  docker:
    compose:
      lifecycle-management: start-only
  modulith:
    events:
      # tabela event_publication criada pelo Flyway (V11)
      jdbc:
        schema-initialization:
          enabled: false
      # ao subir, reenvia o que ficou pendente (ex.: a fila estava fora do ar)
      republish-outstanding-events-on-restart: true

server:
  error:
    include-message: always

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

app:
  events:
    # log: só mostra no log o que iria para a fila (desenvolvimento) · sqs: envia de verdade
    transport: ${APP_EVENTS_TRANSPORT:log}
    queue-prefix: ${APP_EVENTS_QUEUE_PREFIX:beautifulapp-}
    sqs:
      # vazio = AWS real (credenciais da role); http://localhost:9324 = ElasticMQ do docker compose
      endpoint: ${APP_EVENTS_SQS_ENDPOINT:}
      region: ${APP_EVENTS_SQS_REGION:us-east-1}
      access-key: ${APP_EVENTS_SQS_ACCESS_KEY:}
      secret-key: ${APP_EVENTS_SQS_SECRET_KEY:}
      create-queues: ${APP_EVENTS_SQS_CREATE_QUEUES:false}
  cors:
    allowed-origins: ${APP_CORS_ORIGINS:http://localhost:*,http://127.0.0.1:*}
  identity:
    # celulares com acesso ao painel de administração, separados por vírgula (ex: 11999990000,11988887777)
    admin-phones: ${APP_ADMIN_PHONES:}
    jwt:
      issuer: ${APP_JWT_ISSUER:https://api.beautifulapp.dev}
      access-ttl: 15m
      refresh-ttl: 60d
      private-key: ${APP_JWT_PRIVATE_KEY:}
      public-key: ${APP_JWT_PUBLIC_KEY:}
    otp:
      sender: ${APP_OTP_SENDER:log}
      # Ambiente de testes: código fixo, sem custo de SMS. Deixe vazio em produção.
      fixed-code: ${APP_OTP_FIXED_CODE:123456}
      ttl: 5m
      max-attempts: 5
      max-requests-per-hour: 5
      pepper: ${APP_OTP_PEPPER:dev-pepper-change-me}
  media:
    bucket: ${APP_MEDIA_BUCKET:beautifulapp}
    region: ${APP_MEDIA_REGION:us-east-1}
    endpoint: ${APP_MEDIA_ENDPOINT:http://localhost:9090}
    access-key: ${APP_MEDIA_ACCESS_KEY:test}
    secret-key: ${APP_MEDIA_SECRET_KEY:test}
    public-base-url: ${APP_MEDIA_PUBLIC_URL:http://localhost:9090/beautifulapp}
    upload-url-ttl: 10m
    max-bytes: 10485760
